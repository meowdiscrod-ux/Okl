          package com.meowclient.hud;

          import com.meowclient.gui.Glass;
          import com.meowclient.gui.MeowScreen;
          import com.meowclient.gui.Theme;
          import com.meowclient.module.MeowModule;
          import com.meowclient.module.ModuleManager;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.render.RenderTickCounter;

          public final class HudRenderer {
              public static void render(DrawContext ctx, RenderTickCounter tickCounter) {
                  MinecraftClient mc = MinecraftClient.getInstance();
                  if (mc.player == null || mc.world == null || mc.options.hudHidden || mc.currentScreen instanceof MeowScreen) return;
                  var tr = mc.textRenderer;
                  MeowModule layout = ModuleManager.byName("HUD Layout");
                  boolean right = layout != null && layout.bool("Right Side");
                  int opacity = layout == null ? 40 : (int) layout.num("Panel Opacity");
                  boolean titles = layout == null || layout.bool("Show Titles");
                  int acc = Theme.accent(), sw = ctx.getScaledWindowWidth(), sh = ctx.getScaledWindowHeight();
                  int y = 6;

                  for (MeowModule m : ModuleManager.ALL) {
                      if (!m.enabled || m.kind != MeowModule.Kind.HUD) continue;
                      Hud.Block b = Hud.build(m, mc);
                      if (b == null) continue;
                      int w = Math.max(96, titles ? tr.getWidth(b.title()) + 12 : 0);
                      for (String l : b.lines()) w = Math.max(w, tr.getWidth(l) + 12);
                      int h = 6 + (titles ? 12 : 0) + b.lines().size() * 10 + (b.bar() >= 0 ? 8 : 0) + 3;
                      if (y + h > sh - 6) break;
                      int x = right ? sw - w - 6 : 6;
                      Glass.rrect(ctx, x, y, w, h, 5, Glass.argb((int) (opacity * 2.55f), 12, 14, 30));
                      Glass.outline(ctx, x, y, w, h, 5, Glass.a(acc, 150));
                      int ty = y + 4;
                      if (titles) { ctx.drawText(tr, b.title(), x + 6, ty, Glass.a(acc, 255), true); ty += 12; }
                      for (String l : b.lines()) { ctx.drawText(tr, l, x + 6, ty, 0xFFFFFFFF, true); ty += 10; }
                      if (b.bar() >= 0) {
                          int bw = w - 12;
                          Glass.rrect(ctx, x + 6, ty + 1, bw, 4, 2, Glass.argb(90, 255, 255, 255));
                          Glass.rrect(ctx, x + 6, ty + 1, Math.max(3, (int) (bw * Math.min(1f, b.bar()))), 4, 2, b.barColor());
                      }
                      y += h + 4;
                  }

                  if (Hud.warningActive(mc)) {
                      int a = 60 + (int) (50 * Math.sin(System.currentTimeMillis() / 150.0));
                      int c = Glass.argb(a, 239, 68, 68);
                      ctx.fill(0, 0, sw, 3, c); ctx.fill(0, sh - 3, sw, sh, c);
                      ctx.fill(0, 3, 3, sh - 3, c); ctx.fill(sw - 3, 3, sw, sh - 3, c);
                  }
              }
          }
