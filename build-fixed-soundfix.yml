name: Build Meow Client

# Self-contained: this single file contains the whole client source.
# Put it at .github/workflows/build.yml in a GitHub repo, then run it from the Actions tab.

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Write project files
        run: |
          mkdir -p meow-client/.
          cat > meow-client/README.md <<'MEOW_EOF'
          # Meow Client (Fabric, Minecraft 1.21.11, Java 21)

          Mod ID `meowclient` - entry `com.meowclient.MeowClient` - GUI title MEOW CLIENT.

          ## Build
          1. Install JDK 21 and Gradle 9.2.1 (or newer).
          2. In this folder run: `gradle wrapper --gradle-version 9.2.1` (once), then `./gradlew build`
             (Windows: `gradlew.bat build`).
          3. The jar is `build/libs/meow-client-1.0.0.jar` (ignore the `-sources` jar).

          ## Install (PC or MJ Launcher / mobile launchers)
          Fabric Loader 0.18.4+, Fabric API 0.141.1+1.21.11, Java 21 runtime, then drop the jar into `mods/`.

          ## Open the GUI
          Right Shift in-game or on the title screen (rebindable in Controls), or tap the **Meow** button
          at the top-left of the title screen / pause menu (for devices with no keyboard).

          ## Behavior
          - Combat modules Trigger Bot, Aim Assist, Auto Anchor, Auto Pearl Catch, Auto Potion and
            Auto Stun Slam are TESTING PLACEHOLDERS: they save settings and explain the concept; they never
            attack, aim, or swap items.
          - Auto Mace shows an educational live checklist only.
          - All other modules are read-only information HUDs.
          - Settings are saved to `config/meowclient.json`.

          ## Status
          NOT compiled or tested yet (written without network/Gradle access). Minecraft 1.21.9+ changed several
          GUI/input APIs; if the compiler reports a mismatch, the likely spots are `Click`/`KeyInput` in
          `MeowScreen`, `KeyBinding.Category` and `HudRenderCallback` in `MeowClient`, and
          `Window.getHandle()`.
          MEOW_EOF
          mkdir -p meow-client/.
          cat > meow-client/build.gradle <<'MEOW_EOF'
          plugins {
              id 'fabric-loom' version "${loom_version}"
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": inputs.properties.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              withSourcesJar()
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          MEOW_EOF
          mkdir -p meow-client/.
          cat > meow-client/gradle.properties <<'MEOW_EOF'
          org.gradle.jvmargs=-Xmx2G
          org.gradle.parallel=true

          # Mod
          mod_version=1.0.0
          maven_group=com.meowclient
          archives_base_name=meow-client

          # Fabric (Minecraft 1.21.11, Yarn mappings)
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.4
          loader_version=0.18.4
          loom_version=1.14-SNAPSHOT
          fabric_api_version=0.141.1+1.21.11
          MEOW_EOF
          mkdir -p meow-client/.
          cat > meow-client/settings.gradle <<'MEOW_EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'meow-client'
          MEOW_EOF
          mkdir -p meow-client/src/main/java/com/meowclient
          cat > meow-client/src/main/java/com/meowclient/MeowClient.java <<'MEOW_EOF'
          package com.meowclient;

          import com.meowclient.gui.MeowScreen;
          import com.meowclient.combat.CombatEngine;
          import com.meowclient.hud.Hud;
          import com.meowclient.module.MeowModule;
          import com.meowclient.hud.HudRenderer;
          import com.meowclient.module.ModuleManager;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.rendering.v1.HudRenderCallback;
          import net.fabricmc.fabric.api.client.screen.v1.ScreenEvents;
          import net.fabricmc.fabric.api.client.screen.v1.Screens;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.screen.GameMenuScreen;
          import net.minecraft.client.gui.screen.TitleScreen;
          import net.minecraft.client.gui.widget.ButtonWidget;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.text.Text;
          import net.minecraft.util.Identifier;
          import org.lwjgl.glfw.GLFW;

          public class MeowClient implements ClientModInitializer {
              public static final String MOD_ID = "meowclient";
              public static KeyBinding openKey;
              private boolean shiftWasDown;

              @Override
              public void onInitializeClient() {
                  ModuleManager.init();

                  openKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.meowclient.open", InputUtil.Type.KEYSYM, GLFW.GLFW_KEY_RIGHT_SHIFT,
                      KeyBinding.Category.create(Identifier.of(MOD_ID, "main"))));

                  ClientTickEvents.START_CLIENT_TICK.register(CombatEngine::tick);
                  ClientTickEvents.END_CLIENT_TICK.register(this::tick);
                  HudRenderCallback.EVENT.register(HudRenderer::render);

                  // On-screen "Meow" button for launchers/devices without a physical Right Shift key.
                  ScreenEvents.AFTER_INIT.register((client, screen, w, h) -> {
                      if (screen instanceof TitleScreen || screen instanceof GameMenuScreen) {
                          Screens.getButtons(screen).add(ButtonWidget.builder(Text.literal("Meow"),
                              b -> client.setScreen(new MeowScreen(screen))).dimensions(6, 6, 44, 20).build());
                      }
                  });
              }

              private void tick(MinecraftClient client) {
                  Hud.tick(client); // safe: returns early when player/world are null
                  pollBinds(client);

                  if (client.currentScreen == null && client.player != null && client.world != null) {
                      while (openKey.wasPressed()) client.setScreen(new MeowScreen(null));
                  } else if (client.currentScreen instanceof TitleScreen) {
                      // Main menu / client.world == null: poll Right Shift directly (edge-triggered).
                      boolean down = GLFW.glfwGetKey(client.getWindow().getHandle(), GLFW.GLFW_KEY_RIGHT_SHIFT) == GLFW.GLFW_PRESS;
                      if (down && !shiftWasDown) client.setScreen(new MeowScreen(client.currentScreen));
                      shiftWasDown = down;
                  } else {
                      shiftWasDown = false;
                  }
              }

              private final java.util.Map<MeowModule, Boolean> bindState = new java.util.HashMap<>();

              /** Per-module toggle keys (only while in-game with no screen open). */
              private void pollBinds(MinecraftClient client) {
                  if (client.player == null || client.world == null || client.currentScreen != null) { bindState.clear(); return; }
                  long win = client.getWindow().getHandle();
                  for (MeowModule m : ModuleManager.ALL) {
                      int key = m.key("Bind");
                      if (key <= 0) continue;
                      boolean down = GLFW.glfwGetKey(win, key) == GLFW.GLFW_PRESS;
                      boolean was = bindState.getOrDefault(m, false);
                      if (down && !was) m.enabled = !m.enabled;
                      bindState.put(m, down);
                  }
              }
          }
          MEOW_EOF
          mkdir -p meow-client/src/main/java/com/meowclient/combat
          cat > meow-client/src/main/java/com/meowclient/combat/CombatEngine.java <<'MEOW_EOF'
          package com.meowclient.combat;

          import com.meowclient.module.MeowModule;
          import com.meowclient.module.ModuleManager;
          import net.minecraft.block.BlockState;
          import net.minecraft.block.Blocks;
          import net.minecraft.block.RespawnAnchorBlock;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.component.DataComponentTypes;
          import net.minecraft.component.type.PotionContentsComponent;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.attribute.EntityAttributes;
          import net.minecraft.entity.decoration.ArmorStandEntity;
          import net.minecraft.entity.effect.StatusEffectInstance;
          import net.minecraft.entity.effect.StatusEffects;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.entity.player.PlayerInventory;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.network.packet.c2s.play.PlayerMoveC2SPacket;
          import net.minecraft.registry.Registries;
          import net.minecraft.registry.tag.ItemTags;
          import net.minecraft.util.Hand;
          import net.minecraft.util.hit.BlockHitResult;
          import net.minecraft.util.hit.HitResult;
          import net.minecraft.util.math.Box;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.util.math.Vec3d;
          import net.minecraft.world.World;

          import java.util.Random;
          import java.util.function.Predicate;

          /** Combat modules. Runs once per client tick (START_CLIENT_TICK). */
          public final class CombatEngine {
              private static final Random RNG = new Random();

              private static int prevSlot = -1;
              private static long lastAtk, selectedAt, axeHitAt, lastPot, lastPearl, lastAnchor, crossSince;
              private static LivingEntity lock, velOwner;
              private static Vec3d velLast = Vec3d.ZERO, targetVel = Vec3d.ZERO;
              private static Vec3d safePos;

              private static boolean on(MeowModule m) { return m != null && m.enabled; }
              private static long now() { return System.currentTimeMillis(); }

              // ================================================================= main tick
              public static void tick(MinecraftClient mc) {
                  ClientPlayerEntity p = mc.player;
                  if (p == null || mc.world == null || mc.interactionManager == null || mc.getNetworkHandler() == null
                      || mc.currentScreen != null || !p.isAlive()) { prevSlot = -1; return; }
                  if (p.isOnGround()) safePos = p.getEntityPos();

                  MeowModule am = ModuleManager.byName("Auto Mace"), ss = ModuleManager.byName("Auto Stun Slam"),
                      aa = ModuleManager.byName("Aim Assist"), tb = ModuleManager.byName("Trigger Bot"),
                      pot = ModuleManager.byName("Auto Potion"), pearl = ModuleManager.byName("Auto Pearl Catch"),
                      anchor = ModuleManager.byName("Auto Anchor");

                  boolean engaged = false;
                  if (on(ss)) engaged = stunSlam(mc, ss);
                  if (!engaged && on(am)) engaged = autoMace(mc, am);
                  if (!engaged && on(aa)) aimAssist(mc, aa);
                  if (on(tb)) trigger(mc, tb);
                  if (on(pot)) autoPotion(mc, pot);
                  if (on(pearl)) autoPearl(mc, pearl);
                  if (on(anchor)) autoAnchor(mc, anchor);

                  boolean back = (on(am) && am.bool("Switch Back")) || (on(ss) && ss.bool("Switch Back"));
                  if (!engaged && back && prevSlot >= 0 && now() - lastAtk > 200) { selectSlot(mc, prevSlot); prevSlot = -1; }
                  if (!engaged && !back) prevSlot = -1;
              }

              // ================================================================= Auto Mace
              private static boolean falling(ClientPlayerEntity p) {
                  return !p.isOnGround() && p.getVelocity().y < -0.05 && !p.isGliding() && !p.isTouchingWater() && !p.isClimbing();
              }

              private static boolean autoMace(MinecraftClient mc, MeowModule m) {
                  ClientPlayerEntity p = mc.player;
                  ItemStack held = p.getMainHandStack();
                  if (!falling(p)) return false; // never act while standing
                  if (m.bool("Weapons Only") && prevSlot < 0 && !isWeapon(held)) return false;

                  boolean spear = m.bool("Spear Reach") && isSpear(held);
                  double detect = Math.max(m.num("Aim Range"), spear ? m.num("Spear Range") : 0);
                  LivingEntity t = pick(mc, detect, m.bool("Players Only"), 360);
                  if (t == null) return false;
                  int mace = find(p.getInventory(), s -> s.isOf(Items.MACE));
                  if (mace < 0) return false;

                  selectTool(mc, mace);
                  return engage(mc, t, m, true, p.fallDistance > m.num("Min Fall Distance"));
              }

              // ================================================================= Auto Stun Slam
              private static boolean stunSlam(MinecraftClient mc, MeowModule m) {
                  ClientPlayerEntity p = mc.player;
                  ItemStack held = p.getMainHandStack();
                  if (m.bool("Weapons Only") && prevSlot < 0 && !isWeapon(held)) return false;
                  boolean fall = falling(p);
                  LivingEntity t = pick(mc, m.num("Aim Range"), m.bool("Players Only"), 360);
                  if (t == null) return false;
                  int axe = find(p.getInventory(), s -> s.isIn(ItemTags.AXES));
                  int mace = find(p.getInventory(), s -> s.isOf(Items.MACE));
                  long n = now();

                  boolean axePhase = t.isBlocking() && axe >= 0 && n - axeHitAt > 3000;
                  if (axePhase) {
                      selectTool(mc, axe);
                      boolean hit = engage(mc, t, m, false, true);
                      if (hit && lastAtk == n) axeHitAt = n;
                      return true;
                  }
                  if (mace < 0) return false;
                  if (m.bool("Only When Falling") && !fall) return false;
                  if (n - axeHitAt < m.num("Swap Delay")) return true; // waiting between axe and mace
                  selectTool(mc, mace);
                  boolean ok = engage(mc, t, m, true, p.fallDistance > 1.5 || !m.bool("Only When Falling"));
                  if (ok && lastAtk == n) axeHitAt = 0;
                  return true;
              }

              // ================================================================= shared aim + attack
              /** Aims at the target and attacks when it is certain to hit. Returns true while a target is being engaged. */
              private static boolean engage(MinecraftClient mc, LivingEntity t, MeowModule m, boolean checkCharge, boolean allowed) {
                  ClientPlayerEntity p = mc.player;
                  updateVel(t);
                  Vec3d eye = p.getEyePos();
                  Vec3d pt = aimPoint(t, m.mode("Aim For"), eye);
                  boolean silent = m.mode("Aim Mode") == 1;
                  double reach = p.getAttributeValue(EntityAttributes.ENTITY_INTERACTION_RANGE) - 0.05;
                  double dist = distToBox(eye, t.getBoundingBox());

                  if (!silent && dist <= m.num("Aim Range")) aimLegit(mc, pt, m.num("Aim Speed"));
                  if (!allowed || dist > reach) return true;
                  if (now() - lastAtk < m.num("Cooldown")) return true;
                  if (now() - selectedAt < 60) return true;
                  if (checkCharge && p.getAttackCooldownProgress(0.5f) * 100f < m.num("Min Charge")) return true;

                  float[] r = rots(eye, pt);
                  Box box = t.getBoundingBox().expand(0.02);
                  if (silent) {
                      if (rayHits(eye, r[0], r[1], box, reach + 0.05)) silentHit(mc, t, r[0], r[1]);
                  } else if (rayHits(eye, p.getYaw(), p.getPitch(), box, reach + 0.05)) {
                      hit(mc, t);
                  }
                  return true;
              }

              private static void hit(MinecraftClient mc, LivingEntity t) {
                  mc.interactionManager.attackEntity(mc.player, t);
                  mc.player.swingHand(Hand.MAIN_HAND);
                  lastAtk = now();
              }

              /** Rotate on the server only: send a look packet, attack, then send the real rotation back. */
              private static void silentHit(MinecraftClient mc, LivingEntity t, float yaw, float pitch) {
                  ClientPlayerEntity p = mc.player;
                  var net = mc.getNetworkHandler();
                  net.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(yaw, pitch, p.isOnGround(), p.horizontalCollision));
                  hit(mc, t);
                  net.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(p.getYaw(), p.getPitch(), p.isOnGround(), p.horizontalCollision));
              }

              // ================================================================= Aim Assist
              private static void aimAssist(MinecraftClient mc, MeowModule m) {
                  ClientPlayerEntity p = mc.player;
                  if (m.bool("Weapons Only") && !isWeapon(p.getMainHandStack())) return;
                  if (m.bool("Click Only") && !mc.options.attackKey.isPressed()) return;
                  LivingEntity t = pick(mc, m.num("Aim Range"), m.bool("Players Only"), m.num("FOV"));
                  if (t == null) return;
                  updateVel(t);
                  aimLegit(mc, aimPoint(t, m.mode("Aim For"), p.getEyePos()), m.num("Aim Speed"));
              }

              // ================================================================= Trigger Bot
              private static void trigger(MinecraftClient mc, MeowModule m) {
                  ClientPlayerEntity p = mc.player;
                  if (m.bool("Weapons Only") && !isWeapon(p.getMainHandStack())) return;
                  if (!(mc.targetedEntity instanceof LivingEntity le) || !valid(p, le, m.bool("Players Only"))) { crossSince = 0; return; }
                  long n = now();
                  if (crossSince == 0) crossSince = n;
                  if (n - crossSince < m.num("Delay")) return;
                  if (p.getAttackCooldownProgress(0.5f) * 100f < m.num("Min Charge")) return;
                  if (n - lastAtk < 80) return;
                  hit(mc, le);
              }

              // ================================================================= Auto Potion
              private static void autoPotion(MinecraftClient mc, MeowModule m) {
                  ClientPlayerEntity p = mc.player;
                  if (p.getHealth() > m.num("Health Threshold") || now() - lastPot < m.num("Cooldown")) return;
                  int slot = find(p.getInventory(), s -> s.isOf(Items.SPLASH_POTION) && healing(s));
                  if (slot < 0) return;
                  int old = p.getInventory().getSelectedSlot();
                  var net = mc.getNetworkHandler();
                  p.getInventory().setSelectedSlot(slot);
                  if (m.bool("Throw Down")) net.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(p.getYaw(), 90f, p.isOnGround(), p.horizontalCollision));
                  mc.interactionManager.interactItem(p, Hand.MAIN_HAND);
                  p.swingHand(Hand.MAIN_HAND);
                  if (m.bool("Throw Down")) net.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(p.getYaw(), p.getPitch(), p.isOnGround(), p.horizontalCollision));
                  p.getInventory().setSelectedSlot(old);
                  lastPot = now();
              }

              // ================================================================= Auto Pearl Catch
              private static void autoPearl(MinecraftClient mc, MeowModule m) {
                  ClientPlayerEntity p = mc.player;
                  if (safePos == null || now() - lastPearl < m.num("Cooldown")) return;
                  if (p.isOnGround() || p.getVelocity().y > -0.3) return;
                  if (p.getY() > mc.world.getBottomY() + m.num("Void Distance")) return;
                  int slot = find(p.getInventory(), s -> s.isOf(Items.ENDER_PEARL));
                  if (slot < 0) return;
                  Vec3d eye = p.getEyePos();
                  float[] r = rots(eye, safePos.add(0, 1, 0));
                  double d = Math.hypot(safePos.x - p.getX(), safePos.z - p.getZ());
                  float pitch = MathHelper.clamp(r[1] - (float) Math.min(35, d * 0.5), -89f, 89f); // approximate lob arc
                  int old = p.getInventory().getSelectedSlot();
                  var net = mc.getNetworkHandler();
                  p.getInventory().setSelectedSlot(slot);
                  net.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(r[0], pitch, false, p.horizontalCollision));
                  mc.interactionManager.interactItem(p, Hand.MAIN_HAND);
                  p.swingHand(Hand.MAIN_HAND);
                  net.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(p.getYaw(), p.getPitch(), false, p.horizontalCollision));
                  p.getInventory().setSelectedSlot(old);
                  lastPearl = now();
              }

              // ================================================================= Auto Anchor
              private static void autoAnchor(MinecraftClient mc, MeowModule m) {
                  ClientPlayerEntity p = mc.player;
                  if (mc.world.getRegistryKey() == World.NETHER) return;
                  if (!(mc.crosshairTarget instanceof BlockHitResult bhr) || bhr.getType() != HitResult.Type.BLOCK) return;
                  BlockState bs = mc.world.getBlockState(bhr.getBlockPos());
                  if (!bs.isOf(Blocks.RESPAWN_ANCHOR) || now() - lastAnchor < m.num("Step Delay")) return;
                  int charges = bs.get(RespawnAnchorBlock.CHARGES);
                  int old = p.getInventory().getSelectedSlot();
                  int slot;
                  if (charges < (int) m.num("Charges")) slot = find(p.getInventory(), s -> s.isOf(Items.GLOWSTONE));
                  else slot = find(p.getInventory(), s -> !s.isOf(Items.GLOWSTONE));
                  if (slot < 0) return;
                  p.getInventory().setSelectedSlot(slot);
                  mc.interactionManager.interactBlock(p, Hand.MAIN_HAND, bhr);
                  p.swingHand(Hand.MAIN_HAND);
                  p.getInventory().setSelectedSlot(old);
                  lastAnchor = now();
              }

              // ================================================================= targeting
              private static boolean valid(ClientPlayerEntity p, LivingEntity le, boolean playersOnly) {
                  if (le == p || !le.isAlive() || le.isSpectator() || le instanceof ArmorStandEntity) return false;
                  if (playersOnly && !(le instanceof PlayerEntity)) return false;
                  return !(le instanceof PlayerEntity pe && pe.isCreative());
              }

              private static LivingEntity pick(MinecraftClient mc, double range, boolean playersOnly, double fov) {
                  ClientPlayerEntity p = mc.player;
                  Vec3d eye = p.getEyePos();
                  LivingEntity best = null;
                  double bestScore = Double.MAX_VALUE;
                  for (Entity e : mc.world.getEntities()) {
                      if (!(e instanceof LivingEntity le) || !valid(p, le, playersOnly)) continue;
                      double d = distToBox(eye, le.getBoundingBox());
                      if (d > range) continue;
                      float[] r = rots(eye, le.getBoundingBox().getCenter());
                      double ang = Math.hypot(MathHelper.wrapDegrees(r[0] - p.getYaw()), r[1] - p.getPitch());
                      if (fov < 360 && ang > fov / 2.0) continue;
                      double score = d + ang * 0.02 - (le == lock ? 0.8 : 0);
                      if (score < bestScore) { bestScore = score; best = le; }
                  }
                  lock = best;
                  return best;
              }

              private static void updateVel(LivingEntity t) {
                  Vec3d pos = t.getEntityPos();
                  if (velOwner != t) { velOwner = t; velLast = pos; targetVel = Vec3d.ZERO; return; }
                  targetVel = pos.subtract(velLast).multiply(0.9);
                  velLast = pos;
              }

              private static Vec3d aimPoint(LivingEntity t, int mode, Vec3d eye) {
                  Box b = t.getBoundingBox();
                  Vec3d c = b.getCenter();
                  Vec3d pt = switch (mode) {
                      case 0 -> new Vec3d(c.x, t.getEyeY() - 0.08, c.z);
                      case 1 -> new Vec3d(c.x, b.minY + b.getLengthY() * 0.62, c.z);
                      case 2 -> new Vec3d(c.x, b.minY + 0.25, c.z);
                      default -> new Vec3d(MathHelper.clamp(eye.x, b.minX + 0.05, b.maxX - 0.05),
                          MathHelper.clamp(eye.y, b.minY + 0.05, b.maxY - 0.05), MathHelper.clamp(eye.z, b.minZ + 0.05, b.maxZ - 0.05));
                  };
                  return pt.add(targetVel); // lead by one tick of target movement
              }

              private static double distToBox(Vec3d eye, Box b) {
                  return eye.distanceTo(new Vec3d(MathHelper.clamp(eye.x, b.minX, b.maxX), MathHelper.clamp(eye.y, b.minY, b.maxY), MathHelper.clamp(eye.z, b.minZ, b.maxZ)));
              }

              private static boolean rayHits(Vec3d eye, float yaw, float pitch, Box box, double range) {
                  Vec3d look = Vec3d.fromPolar(pitch, yaw);
                  return box.raycast(eye, eye.add(look.multiply(range))).isPresent();
              }

              // ================================================================= rotation
              private static float[] rots(Vec3d eye, Vec3d t) {
                  double dx = t.x - eye.x, dy = t.y - eye.y, dz = t.z - eye.z;
                  float yaw = (float) (Math.toDegrees(Math.atan2(dz, dx)) - 90.0);
                  float pitch = (float) -Math.toDegrees(Math.atan2(dy, Math.hypot(dx, dz)));
                  return new float[]{yaw, MathHelper.clamp(pitch, -90f, 90f)};
              }

              /** Eased, speed-capped turn with tiny human variation and mouse-step (GCD) snapping. Moves, never flicks. */
              private static void aimLegit(MinecraftClient mc, Vec3d point, double speed) {
                  ClientPlayerEntity p = mc.player;
                  float[] r = rots(p.getEyePos(), point);
                  float dy = MathHelper.wrapDegrees(r[0] - p.getYaw()), dp = r[1] - p.getPitch();
                  double k = (0.04 + speed / 100.0 * 0.40) * (0.9 + RNG.nextDouble() * 0.2);
                  double cap = 2.0 + speed * 0.28; // max degrees per tick
                  double sy = MathHelper.clamp(dy * k, -cap, cap) + (RNG.nextDouble() - 0.5) * 0.12;
                  double sp = MathHelper.clamp(dp * k * 0.85, -cap * 0.7, cap * 0.7) + (RNG.nextDouble() - 0.5) * 0.08;
                  if (Math.abs(dy) < 0.05) sy = 0;
                  if (Math.abs(dp) < 0.05) sp = 0;
                  double f = mc.options.getMouseSensitivity().getValue() * 0.6 + 0.2;
                  double gcd = f * f * f * 8.0 * 0.15;
                  sy = Math.round(sy / gcd) * gcd;
                  sp = Math.round(sp / gcd) * gcd;
                  p.setYaw(p.getYaw() + (float) sy);
                  p.setPitch(MathHelper.clamp(p.getPitch() + (float) sp, -90f, 90f));
              }

              // ================================================================= inventory
              private static int find(PlayerInventory inv, Predicate<ItemStack> f) {
                  for (int i = 0; i < 9; i++) { ItemStack s = inv.getStack(i); if (!s.isEmpty() && f.test(s)) return i; }
                  return -1;
              }

              private static void selectSlot(MinecraftClient mc, int slot) {
                  if (mc.player.getInventory().getSelectedSlot() != slot) { mc.player.getInventory().setSelectedSlot(slot); selectedAt = now(); }
              }

              /** Select a slot, remembering the slot we came from (only the first time). */
              private static void selectTool(MinecraftClient mc, int slot) {
                  int cur = mc.player.getInventory().getSelectedSlot();
                  if (cur == slot) return;
                  if (prevSlot < 0) prevSlot = cur;
                  selectSlot(mc, slot);
              }

              private static boolean isSpear(ItemStack s) { return Registries.ITEM.getId(s.getItem()).getPath().endsWith("_spear"); }

              private static boolean isWeapon(ItemStack s) {
                  return s.isIn(ItemTags.SWORDS) || s.isIn(ItemTags.AXES) || s.isOf(Items.MACE) || s.isOf(Items.TRIDENT) || isSpear(s);
              }

              private static boolean healing(ItemStack s) {
                  PotionContentsComponent pc = s.get(DataComponentTypes.POTION_CONTENTS);
                  if (pc == null) return false;
                  for (StatusEffectInstance e : pc.getEffects()) if (e.getEffectType().equals(StatusEffects.INSTANT_HEALTH)) return true;
                  return false;
              }
          }
