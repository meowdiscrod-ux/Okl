                      k("Bind", "Key that toggles Aim Assist."),
                      n("Aim Speed", 30, 1, 100, 1, "", "Turn speed. Low = gentle pull, high = faster. Never snaps."),
                      n("Aim Range", 4.5, 2.0, 8.0, 0.5, "blocks", "Maximum target distance."),
                      new Setting.Mode("Aim For", "Body part to aim at.", 1, AIM),
