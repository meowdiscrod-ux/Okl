          package com.meowclient.module;

          import com.google.gson.*;
          import com.meowclient.gui.Theme;
          import net.fabricmc.loader.api.FabricLoader;

          import java.nio.file.Files;
          import java.nio.file.Path;
          import java.util.ArrayList;
          import java.util.List;

          public final class ModuleManager {
              public static final List<MeowModule> ALL = new ArrayList<>();
              public static final String[] CATEGORIES = {"Combat", "Movement", "Player", "Visual", "Misc"};
              public static final String[] COMBAT_SECTIONS = {"General Combat", "NethPot", "Crystal PvP", "UHC", "Mace PvP"};

              private static Path file() { return FabricLoader.getInstance().getConfigDir().resolve("meowclient.json"); }

              public static void init() { Content.register(); load(); }

              public static List<MeowModule> in(String category, String section) {
                  List<MeowModule> out = new ArrayList<>();
                  for (MeowModule m : ALL) if (m.category.equals(category) && (section == null || m.section.equals(section))) out.add(m);
                  return out;
              }

              public static MeowModule byName(String name) {
                  for (MeowModule m : ALL) if (m.name.equals(name)) return m;
                  return null;
              }

              public static void save() {
                  try {
                      JsonObject root = new JsonObject();
                      root.addProperty("theme", Theme.index);
                      JsonObject mods = new JsonObject();
                      for (MeowModule m : ALL) {
                          JsonObject o = new JsonObject();
                          o.addProperty("enabled", m.enabled);
                          JsonObject s = new JsonObject();
                          for (Setting st : m.settings) s.add(st.name, st.save());
                          o.add("settings", s);
                          mods.add(m.id(), o);
                      }
                      root.add("modules", mods);
                      Files.writeString(file(), new GsonBuilder().setPrettyPrinting().create().toJson(root));
                  } catch (Exception e) {
                      System.err.println("[MeowClient] Failed to save config: " + e);
                  }
              }

              public static void load() {
                  try {
                      Path f = file();
                      if (!Files.exists(f)) return;
                      JsonObject root = JsonParser.parseString(Files.readString(f)).getAsJsonObject();
                      if (root.has("theme")) Theme.set(root.get("theme").getAsInt());
                      JsonObject mods = root.getAsJsonObject("modules");
                      if (mods == null) return;
                      for (MeowModule m : ALL) {
                          if (!mods.has(m.id())) continue;
                          JsonObject o = mods.getAsJsonObject(m.id());
                          if (o.has("enabled")) m.enabled = o.get("enabled").getAsBoolean();
                          JsonObject s = o.getAsJsonObject("settings");
                          if (s == null) continue;
                          for (Setting st : m.settings) if (s.has(st.name)) st.load(s.get(st.name));
                      }
                  } catch (Exception e) {
                      System.err.println("[MeowClient] Failed to load config: " + e);
                  }
              }
          }
          MEOW_EOF
          mkdir -p meow-client/src/main/java/com/meowclient/module
          cat > meow-client/src/main/java/com/meowclient/module/Setting.java <<'MEOW_EOF'
          package com.meowclient.module;

          import com.google.gson.JsonElement;
          import com.google.gson.JsonPrimitive;

          public abstract class Setting {
              public final String name, desc;

              protected Setting(String name, String desc) { this.name = name; this.desc = desc; }

              public abstract void load(JsonElement e);
              public abstract JsonElement save();

              public static class Bool extends Setting {
                  public boolean value;
                  public Bool(String n, boolean def, String d) { super(n, d); value = def; }
                  @Override public void load(JsonElement e) { try { value = e.getAsBoolean(); } catch (Exception ignored) {} }
                  @Override public JsonElement save() { return new JsonPrimitive(value); }
              }

              public static class Num extends Setting {
                  public double value, min, max, step;
                  public String unit;
                  public Num(String n, double def, double min, double max, double step, String unit, String d) {
                      super(n, d); this.value = def; this.min = min; this.max = max; this.step = step; this.unit = unit;
                  }
                  public void set(double v) {
                      v = Math.round(v / step) * step;
                      value = Math.max(min, Math.min(max, v));
                  }
                  public void setFraction(double f) { set(min + Math.max(0, Math.min(1, f)) * (max - min)); }
                  public double fraction() { return (value - min) / (max - min); }
                  public String display() {
                      String s = step >= 1 ? String.valueOf((int) Math.round(value)) : String.format("%.1f", value);
                      return unit.isEmpty() ? s : s + " " + unit;
                  }
                  @Override public void load(JsonElement e) { try { set(e.getAsDouble()); } catch (Exception ignored) {} }
                  @Override public JsonElement save() { return new JsonPrimitive(value); }
              }

              public static class Key extends Setting {
                  public int value = -1;
                  public boolean listening;
                  public Key(String n, String d) { super(n, d); }
                  public String display() {
                      if (value < 0) return "None";
                      String n = org.lwjgl.glfw.GLFW.glfwGetKeyName(value, 0);
                      if (n != null) return n.toUpperCase();
                      return switch (value) {
                          case 340 -> "L-SHIFT"; case 344 -> "R-SHIFT"; case 341 -> "L-CTRL"; case 345 -> "R-CTRL";
                          case 342 -> "L-ALT"; case 346 -> "R-ALT"; case 32 -> "SPACE"; case 258 -> "TAB"; case 280 -> "CAPS";
                          case 262 -> "RIGHT"; case 263 -> "LEFT"; case 264 -> "DOWN"; case 265 -> "UP";
                          default -> value >= 290 && value <= 301 ? "F" + (value - 289) : "KEY " + value;
                      };
                  }
                  @Override public void load(JsonElement e) { try { value = e.getAsInt(); } catch (Exception ignored) {} }
                  @Override public JsonElement save() { return new JsonPrimitive(value); }
              }

              public static class Mode extends Setting {
                  public int index;
                  public final String[] options;
                  public Mode(String n, String d, int def, String... options) { super(n, d); this.index = def; this.options = options; }
                  public String current() { return options[index]; }
                  public void cycle() { index = (index + 1) % options.length; }
                  @Override public void load(JsonElement e) { try { int i = e.getAsInt(); if (i >= 0 && i < options.length) index = i; } catch (Exception ignored) {} }
                  @Override public JsonElement save() { return new JsonPrimitive(index); }
              }
          }
